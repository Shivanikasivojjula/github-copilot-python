<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Sudoku Game</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <h1>Sudoku Game</h1>
  <div id="sudoku-board"></div>
  <div class="controls">
    <label for="player-name">Player</label>
    <input id="player-name" type="text" maxlength="30" placeholder="Your name">
    <label for="difficulty">Difficulty</label>
    <select id="difficulty">
      <option value="easy">Easy</option>
      <option value="medium" selected>Medium</option>
      <option value="hard">Hard</option>
    </select>
    <button id="new-game">New Game</button>
    <button id="check-solution">Check Solution</button>
    <button id="hint">Hint</button>
    <button id="dark-mode" type="button" aria-pressed="false">Dark Mode</button>
    <span>Time: <strong id="timer">00:00</strong></span>
    <span>Hints: <strong id="hints">0</strong></span>
    <span id="message"></span>
  </div>
  <section id="leaderboard" aria-labelledby="leaderboard-title">
    <h2 id="leaderboard-title">Top 10</h2>
    <table>
      <thead>
        <tr><th>Player</th><th>Time</th><th>Difficulty</th><th>Hints</th></tr>
      </thead>
      <tbody id="leaderboard-body"></tbody>
    </table>
  </section>
  <script src="/static/main.js"></script>
</body>
</html>
